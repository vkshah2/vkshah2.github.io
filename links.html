<!DOCTYPE html>

<head>

    <style>
        :root {
            --primary: #92400e;
            --primary-dark: #78350f;
            --accent: #d97706;
            --bg-secondary: #fef3c7;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: #fafafa;
        }
        nav {
            background: white;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }
        .search-container {
            flex: 1;
            max-width: 500px;
        }
        #searchInput {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
        }
        .page-header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .page-header p {
            font-size: 1.125rem;
            color: var(--text-secondary);
        }
        .stats {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        .links-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .links-section {
            margin-bottom: 3rem;
        }
        .section-title {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 1.5rem;
            background: var(--primary);
            border-radius: 2px;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .link-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
        }
        .link-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(146, 64, 14, 0.15);
            border-color: var(--primary);
        }
        .link-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .link-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .link-info { flex: 1; }
        .link-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }
        .link-url {
            font-size: 0.875rem;
            color: var(--accent);
            word-break: break-all;
        }
        .link-description {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            line-height: 1.5;
        }
        .link-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .tag {
            background: var(--bg-secondary);
            color: var(--primary-dark);
            padding: 0.25rem 0.625rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        footer {
            margin-top: 4rem;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--border);
            background: white;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }
        .social-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        footer p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .hidden { display: none; }
        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            .links-grid { grid-template-columns: 1fr; }
            .stats { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>

function renderResources() {
    const container = document.getElementById('linksContainer');
    let totalCount = 0;
    let html = '';
    
    for (const [category, items] of Object.entries(resources)) {
        totalCount += items.length;
        html += `
        <section class="links-section">
            <h2 class="section-title">${category}</h2>
            <div class="links-grid">
                ${items.map(item => `
                    <a href="${item.link}" class="link-card" target="_blank" rel="noopener">
                        <div class="link-header">
                            <div class="link-icon">${item.icon}</div>
                            <div class="link-info">
                                <div class="link-title">${item.title}</div>
                                <div class="link-url">${item.url}</div>
                            </div>
                        </div>
                        <p class="link-description">${item.desc}</p>
                        <div class="link-tags">
                            ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </a>
                `).join('')}
            </div>
        </section>`;
    }
    
    container.innerHTML = html;
    document.getElementById('totalResources').textContent = `📊 Total Resources: ${totalCount}`;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    document.querySelectorAll('.link-card').forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? 'block' : 'none';
    });
    
    document.querySelectorAll('.links-section').forEach(section => {
        const visible = Array.from(section.querySelectorAll('.link-card'))
            .some(card => card.style.display !== 'none');
        section.style.display = visible ? 'block' : 'none';
    });
});

renderResources();
