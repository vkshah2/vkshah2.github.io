<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://linktr.ee/vkshah2">
    <meta name="description" content="Learn more about Vinit K Shah - Developer, Designer, and Tech Enthusiast">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <title>About - Redirecting to Linktree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #92400e;
            --primary-dark: #78350f;
            --accent: #d97706;
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --bg-primary: #fafaf9;
            --bg-secondary: #fef3c7;
            --border: #e7e5e4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .redirect-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }

        .redirect-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 1.125rem;
        }

        .redirect-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .redirect-link:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-secondary);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-icon">🔗</div>
        <h1>Redirecting to Linktree</h1>
        <p>You're being redirected to my Linktree page...</p>
        <p>If you're not redirected automatically, click below:</p>
        <a href="https://linktr.ee/vkshah2" class="redirect-link">Go to Linktree</a>
        <div class="spinner"></div>
    </div>

    <script>
        // Redirect after a short delay to allow users to see the message
        setTimeout(() => {
            window.location.href = 'https://linktr.ee/vkshah2';
        }, 1000);
    </script>
</body>
</html>
